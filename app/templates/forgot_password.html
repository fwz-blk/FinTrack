{% extends "public_base.html" %}
{% block title %}Reset password — FinTrack{% endblock %}
{% block content %}<main class="auth"><section class="auth-form"><a href="{{ url_for('login') }}" class="back">← &nbsp; Back to login</a><h2>Reset your password</h2><p class="muted">Enter your account email to receive reset instructions.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field-wrap"><label for="email">Email</label><input id="email" name="email" class="field" type="email" required></div><button class="btn block" type="submit">Send reset link</button></form></section></main>{% endblock %}
