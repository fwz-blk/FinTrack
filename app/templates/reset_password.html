{% extends "public_base.html" %}
{% block title %}Choose a new password — FinTrack{% endblock %}
{% block content %}<main class="auth"><section class="auth-form"><h2>Choose a new password</h2>{% with messages = get_flashed_messages() %}{% if messages %}<p class="form-message">{{ messages[0] }}</p>{% endif %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field-wrap"><label for="password">New password</label><input id="password" name="password" class="field" type="password" required></div><div class="field-wrap"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" class="field" type="password" required></div><button class="btn block" type="submit">Update password</button></form></section></main>{% endblock %}
